<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="collection-title collection-desc">
  <title id="collection-title">Airflow collection workflow</title>
  <desc id="collection-desc">Sale, rent, and auction collection each run as 107 independent province tasks. All three groups feed data-lake statistics.</desc>
  <defs>
    <marker id="collection-arrow" markerWidth="16" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 14 6 0 12Z" fill="#2698ba" stroke="none" />
    </marker>
    <style>
      .heading { fill: #f8f9fa; font: 700 34px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subheading { fill: #a8aaad; font: 400 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .phase { fill: #2698ba; font: 700 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.8px; }
      .name { fill: #f8f9fa; font: 700 22px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .detail { fill: #a8aaad; font: 400 17px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card { fill: #212529; stroke: #3a3f44; stroke-width: 2; }
      .flow { fill: none; stroke: #2698ba; stroke-width: 3; stroke-linecap: butt; marker-end: url(#collection-arrow); }
    </style>
  </defs>
  <rect width="960" height="700" rx="28" fill="#1c1c1d" />
  <text x="56" y="72" class="heading">Airflow collection workflow</text>
  <text x="56" y="110" class="subheading">321 independent province tasks, grouped below by listing type</text>
  <g transform="translate(56 170)">
    <rect width="256" height="260" rx="18" class="card" />
    <text x="24" y="36" class="phase">TASK GROUP</text>
    <text x="24" y="72" class="name">Sale listings</text>
    <text x="24" y="112" class="detail">Province 1 collection</text>
    <text x="24" y="141" class="detail">Province 2 collection</text>
    <text x="24" y="170" class="detail">Province 3 collection</text>
    <text x="24" y="199" class="detail">…</text>
    <text x="24" y="228" class="detail">Province 107 collection</text>
  </g>
  <path d="M184 430V510" class="flow" />
  <g transform="translate(352 170)">
    <rect width="256" height="260" rx="18" class="card" />
    <text x="24" y="36" class="phase">TASK GROUP</text>
    <text x="24" y="72" class="name">Rent listings</text>
    <text x="24" y="112" class="detail">Province 1 collection</text>
    <text x="24" y="141" class="detail">Province 2 collection</text>
    <text x="24" y="170" class="detail">Province 3 collection</text>
    <text x="24" y="199" class="detail">…</text>
    <text x="24" y="228" class="detail">Province 107 collection</text>
  </g>
  <path d="M480 430V510" class="flow" />
  <g transform="translate(648 170)">
    <rect width="256" height="260" rx="18" class="card" />
    <text x="24" y="36" class="phase">TASK GROUP</text>
    <text x="24" y="72" class="name">Auction listings</text>
    <text x="24" y="112" class="detail">Province 1 collection</text>
    <text x="24" y="141" class="detail">Province 2 collection</text>
    <text x="24" y="170" class="detail">Province 3 collection</text>
    <text x="24" y="199" class="detail">…</text>
    <text x="24" y="228" class="detail">Province 107 collection</text>
  </g>
  <path d="M776 430V510" class="flow" />
  <g transform="translate(56 530)">
    <rect width="848" height="110" rx="18" class="card" />
    <text x="32" y="43" class="name">Data-lake statistics</text>
    <text x="32" y="78" class="detail">After the province collection tasks</text>
  </g>
  <text x="56" y="672" class="detail">Each group contains 107 independent tasks; the province list is abbreviated.</text>
</svg>
