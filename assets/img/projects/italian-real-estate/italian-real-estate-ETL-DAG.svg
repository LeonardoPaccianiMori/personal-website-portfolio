<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="etl-title etl-desc">
  <title id="etl-title">Airflow extraction and transformation workflow</title>
  <desc id="etl-desc">Three parallel ETL tasks process sale, rent, and auction listings, then feed data-warehouse statistics.</desc>
  <defs>
    <marker id="etl-arrow" markerWidth="16" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 14 6 0 12Z" fill="#2698ba" stroke="none" />
    </marker>
    <style>
      .heading { fill: #f8f9fa; font: 700 34px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subheading { fill: #a8aaad; font: 400 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .phase { fill: #2698ba; font: 700 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.8px; }
      .name { fill: #f8f9fa; font: 700 22px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .detail { fill: #a8aaad; font: 400 17px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card { fill: #212529; stroke: #3a3f44; stroke-width: 2; }
      .flow { fill: none; stroke: #2698ba; stroke-width: 3; stroke-linecap: butt; marker-end: url(#etl-arrow); }
    </style>
  </defs>
  <rect width="960" height="620" rx="28" fill="#1c1c1d" />
  <text x="56" y="72" class="heading">Airflow extraction and transformation workflow</text>
  <text x="56" y="110" class="subheading">Three parallel tasks, one for each listing type</text>
  <g transform="translate(56 170)">
    <rect width="256" height="180" rx="18" class="card" />
    <text x="24" y="36" class="phase">ETL TASK</text>
    <text x="24" y="72" class="name">Sale listings</text>
    <text x="24" y="112" class="detail">Extract and transform</text>
    <text x="24" y="140" class="detail">listing records</text>
  </g>
  <path d="M184 350V430" class="flow" />
  <g transform="translate(352 170)">
    <rect width="256" height="180" rx="18" class="card" />
    <text x="24" y="36" class="phase">ETL TASK</text>
    <text x="24" y="72" class="name">Rent listings</text>
    <text x="24" y="112" class="detail">Extract and transform</text>
    <text x="24" y="140" class="detail">listing records</text>
  </g>
  <path d="M480 350V430" class="flow" />
  <g transform="translate(648 170)">
    <rect width="256" height="180" rx="18" class="card" />
    <text x="24" y="36" class="phase">ETL TASK</text>
    <text x="24" y="72" class="name">Auction listings</text>
    <text x="24" y="112" class="detail">Extract and transform</text>
    <text x="24" y="140" class="detail">listing records</text>
  </g>
  <path d="M776 350V430" class="flow" />
  <g transform="translate(56 450)">
    <rect width="848" height="110" rx="18" class="card" />
    <text x="32" y="43" class="name">Data-warehouse statistics</text>
    <text x="32" y="78" class="detail">After the three listing-type ETL tasks</text>
  </g>
  <text x="56" y="592" class="detail">Sale, rent, and auction records are processed in parallel.</text>
</svg>
