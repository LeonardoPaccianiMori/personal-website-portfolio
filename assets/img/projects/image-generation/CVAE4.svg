<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1430" role="img" aria-labelledby="cvae4-title cvae4-desc"><title id="cvae4-title">CVAE-4 architecture</title><desc id="cvae4-desc">A three-layer convolutional encoder and three dense layers map MNIST images to a two-dimensional latent space. Four dense layers and four transpose-convolutional layers reconstruct the image.</desc><defs><marker id="cvae4-arrow" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#2698ba"/></marker><style>.h{fill:#f8f9fa;font:700 36px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.s{fill:#a8aaad;font:400 18px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.r{fill:#2698ba;font:700 15px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.8px}.k{fill:#2698ba;font:700 14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.3px}.n{fill:#f8f9fa;font:700 22px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.d{fill:#a8aaad;font:400 17px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.c{fill:#212529;stroke:#3a3f44;stroke-width:2}.z{fill:#222d31;stroke:#2698ba;stroke-width:2}.a{fill:none;stroke:#2698ba;stroke-width:4;marker-end:url(#cvae4-arrow)}</style></defs><rect width="1200" height="1430" rx="28" fill="#1c1c1d"/><text x="60" y="62" class="h">CVAE-4 · connected-layer expansion</text><text x="60" y="94" class="s">The baseline convolutional path with additional dense transformations around the latent space</text><text x="60" y="133" class="r">ENCODER</text><g transform="translate(60 155)"><rect width="340" height="200" rx="18" class="c"/><text x="24" y="38" class="k">INPUT</text><text x="24" y="81" class="n">MNIST image</text><text x="24" y="115" class="d">28 × 28 × 1</text></g><path d="M400 255h30" class="a"/><g transform="translate(430 155)"><rect width="340" height="200" rx="18" class="c"/><text x="24" y="38" class="k">CONVOLUTION STACK</text><text x="24" y="81" class="n">32 → 64 → 32 filters</text><text x="24" y="115" class="d">3 × 3 · stride 1 · ReLU</text><text x="24" y="145" class="d">Same padding · 28 × 28</text></g><path d="M770 255h30" class="a"/><g transform="translate(800 155)"><rect width="340" height="200" rx="18" class="c"/><text x="24" y="38" class="k">FLATTEN</text><text x="24" y="81" class="n">25,088 features</text><text x="24" y="115" class="d">28 × 28 × 32 → vector</text></g><path d="M970 355v95" class="a"/><g transform="translate(800 450)"><rect width="340" height="200" rx="18" class="c"/><text x="24" y="38" class="k">ENCODER DENSE STACK</text><text x="24" y="81" class="n">300 → 200 → 100 units</text><text x="24" y="115" class="d">ReLU → ReLU → linear</text></g><path d="M800 550h-30" class="a"/><g transform="translate(430 450)"><rect width="340" height="200" rx="18" class="z"/><text x="24" y="38" class="k">LATENT SPACE</text><text x="24" y="81" class="n">μ and σ → z</text><text x="24" y="115" class="d">Reparametrization · dimension 2</text></g><text x="60" y="763" class="r">DECODER</text><path d="M600 650v150" class="a"/><g transform="translate(430 800)"><rect width="340" height="200" rx="18" class="z"/><text x="24" y="38" class="k">LATENT INPUT</text><text x="24" y="81" class="n">z₁, z₂</text><text x="24" y="115" class="d">Shape 2</text></g><path d="M770 900h30" class="a"/><g transform="translate(800 800)"><rect width="340" height="200" rx="18" class="c"/><text x="24" y="38" class="k">DECODER DENSE AND RESHAPE</text><text x="24" y="81" class="n">25,088 → 100 → 200 → 300</text><text x="24" y="115" class="d">ReLU at every stage · 28 × 28 × 32</text></g><path d="M970 1000v150h-200" class="a"/><g transform="translate(430 1150)"><rect width="340" height="200" rx="18" class="c"/><text x="24" y="38" class="k">TRANSPOSE-CONVOLUTION STACK</text><text x="24" y="81" class="n">32 → 64 → 32 → 1 filters</text><text x="24" y="115" class="d">3 × 3 · stride 1 · same padding</text><text x="24" y="145" class="d">ReLU, then sigmoid output</text></g><path d="M430 1250h-30" class="a"/><g transform="translate(60 1150)"><rect width="340" height="200" rx="18" class="c"/><text x="24" y="38" class="k">OUTPUT</text><text x="24" y="81" class="n">Reconstructed digit</text><text x="24" y="115" class="d">28 × 28 × 1</text></g><text x="60" y="1400" class="s">The extra dense stages change the connected path while the convolutional encoder and output stack remain aligned with CVAE-1.</text></svg>
