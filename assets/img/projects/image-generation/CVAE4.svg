<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="cvae4-title cvae4-desc">
  <title id="cvae4-title">CVAE-4 architecture</title>
  <desc id="cvae4-desc">A three-layer convolutional encoder and three dense layers map MNIST images to a two-dimensional latent space. Four dense layers and four transpose-convolutional layers reconstruct the image.</desc>
  <defs><marker id="cvae4-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 7 3 0 6Z" fill="#2698ba"/></marker><style>.h{fill:#f8f9fa;font:700 30px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.s{fill:#a8aaad;font:400 16px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.r{fill:#2698ba;font:700 13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.5px}.k{fill:#2698ba;font:700 11px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.1px}.n{fill:#f8f9fa;font:700 16px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.d{fill:#a8aaad;font:400 12.5px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.c{fill:#212529;stroke:#3a3f44;stroke-width:2}.z{fill:#222d31;stroke:#2698ba;stroke-width:2}.a{fill:none;stroke:#2698ba;stroke-width:3;marker-end:url(#cvae4-arrow)}</style></defs>
  <rect width="1200" height="760" rx="28" fill="#1c1c1d"/><text x="42" y="54" class="h">CVAE-4 · connected-layer expansion</text><text x="42" y="84" class="s">The baseline convolutional path with additional dense transformations around the latent space</text>
  <text x="42" y="126" class="r">ENCODER</text>
  <g transform="translate(42 146)"><rect width="140" height="190" rx="16" class="c"/><text x="18" y="32" class="k">INPUT</text><text x="18" y="65" class="n">MNIST image</text><text x="18" y="94" class="d">28 × 28 × 1</text><rect x="42" y="119" width="56" height="46" rx="7" fill="none" stroke="#2698ba" stroke-width="3"/><path d="M61 119v46M80 119v46M42 135h56M42 150h56" stroke="#2698ba" stroke-width="2"/></g><path d="M182 241h24" class="a"/>
  <g transform="translate(214 146)"><rect width="250" height="190" rx="16" class="c"/><text x="18" y="32" class="k">CONVOLUTION STACK</text><text x="18" y="65" class="n">32 → 64 → 32 filters</text><text x="18" y="96" class="d">3 × 3 · stride 1 · ReLU</text><text x="18" y="122" class="d">Same padding</text><text x="18" y="153" class="n">28 × 28 spatial size</text></g><path d="M464 241h24" class="a"/>
  <g transform="translate(496 146)"><rect width="132" height="190" rx="16" class="c"/><text x="16" y="32" class="k">FLATTEN</text><text x="16" y="65" class="n">25,088</text><text x="16" y="94" class="d">features</text><path d="M31 128h70M31 148h70M66 118v40" stroke="#2698ba" stroke-width="3"/></g><path d="M628 241h24" class="a"/>
  <g transform="translate(660 146)"><rect width="232" height="190" rx="16" class="c"/><text x="18" y="32" class="k">DENSE STACK</text><text x="18" y="65" class="n">300 → 200 → 100</text><text x="18" y="96" class="d">ReLU → ReLU → linear</text><g fill="#2698ba"><circle cx="52" cy="140" r="7"/><circle cx="91" cy="140" r="7"/><circle cx="130" cy="140" r="7"/><circle cx="169" cy="140" r="7"/></g></g><path d="M892 241h24" class="a"/>
  <g transform="translate(924 146)"><rect width="234" height="190" rx="16" class="z"/><text x="18" y="32" class="k">LATENT SPACE</text><text x="18" y="65" class="n">μ and σ → z</text><text x="18" y="94" class="d">Reparametrization</text><text x="18" y="125" class="n">Dimension 2</text><circle cx="188" cy="74" r="18" fill="none" stroke="#2698ba" stroke-width="3"/><circle cx="188" cy="127" r="18" fill="none" stroke="#2698ba" stroke-width="3"/></g>
  <text x="42" y="414" class="r">DECODER</text>
  <g transform="translate(42 434)"><rect width="140" height="190" rx="16" class="z"/><text x="18" y="32" class="k">LATENT INPUT</text><text x="18" y="65" class="n">z₁, z₂</text><text x="18" y="94" class="d">Shape 2</text><circle cx="48" cy="138" r="14" fill="none" stroke="#2698ba" stroke-width="3"/><circle cx="93" cy="138" r="14" fill="none" stroke="#2698ba" stroke-width="3"/></g><path d="M182 529h24" class="a"/>
  <g transform="translate(214 434)"><rect width="265" height="190" rx="16" class="c"/><text x="18" y="32" class="k">DENSE STACK</text><text x="18" y="65" class="n">25,088 → 100 → 200 → 300</text><text x="18" y="96" class="d">ReLU at every stage</text><g fill="#2698ba"><circle cx="55" cy="140" r="7"/><circle cx="101" cy="140" r="7"/><circle cx="147" cy="140" r="7"/><circle cx="193" cy="140" r="7"/></g></g><path d="M479 529h24" class="a"/>
  <g transform="translate(511 434)"><rect width="165" height="190" rx="16" class="c"/><text x="17" y="32" class="k">RESHAPE</text><text x="17" y="65" class="n">28 × 28 × 32</text><text x="17" y="94" class="d">Feature maps</text><path d="M42 128h63l14 14H56Z" fill="none" stroke="#2698ba" stroke-width="3"/><path d="M42 143h63l14 14H56Z" fill="none" stroke="#2698ba" stroke-width="3"/></g><path d="M676 529h24" class="a"/>
  <g transform="translate(708 434)"><rect width="300" height="190" rx="16" class="c"/><text x="18" y="32" class="k">TRANSPOSE-CONVOLUTION STACK</text><text x="18" y="65" class="n">32 → 64 → 32 → 1 filters</text><text x="18" y="96" class="d">3 × 3 · stride 1 · same padding</text><text x="18" y="122" class="d">ReLU, then sigmoid output</text><text x="18" y="153" class="n">28 × 28 × 1</text></g><path d="M1008 529h24" class="a"/>
  <g transform="translate(1040 434)"><rect width="118" height="190" rx="16" class="c"/><text x="15" y="32" class="k">OUTPUT</text><text x="15" y="65" class="n">Digit</text><text x="15" y="94" class="d">28 × 28</text><rect x="31" y="116" width="56" height="50" rx="7" fill="none" stroke="#2698ba" stroke-width="3"/></g>
  <text x="42" y="692" class="s">The extra dense stages change the connected path while the convolutional encoder and output stack remain aligned with CVAE-1.</text>
</svg>
