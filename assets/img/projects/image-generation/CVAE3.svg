<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="cvae3-title cvae3-desc">
  <title id="cvae3-title">CVAE-3 architecture</title>
  <desc id="cvae3-desc">A deeper five-layer convolutional encoder maps MNIST images to a two-dimensional latent space. A corresponding transpose-convolutional decoder reconstructs the image.</desc>
  <defs><marker id="cvae3-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 7 3 0 6Z" fill="#2698ba"/></marker><style>.h{fill:#f8f9fa;font:700 30px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.s{fill:#a8aaad;font:400 16px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.r{fill:#2698ba;font:700 13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.5px}.k{fill:#2698ba;font:700 11px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.1px}.n{fill:#f8f9fa;font:700 16px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.d{fill:#a8aaad;font:400 12.5px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.c{fill:#212529;stroke:#3a3f44;stroke-width:2}.z{fill:#222d31;stroke:#2698ba;stroke-width:2}.a{fill:none;stroke:#2698ba;stroke-width:3;marker-end:url(#cvae3-arrow)}</style></defs>
  <rect width="1200" height="760" rx="28" fill="#1c1c1d"/><text x="42" y="54" class="h">CVAE-3 · deeper convolutional path</text><text x="42" y="84" class="s">Five encoder stages, a two-dimensional latent space, and a mirrored decoder</text>
  <text x="42" y="126" class="r">ENCODER</text>
  <g transform="translate(42 146)"><rect width="150" height="190" rx="16" class="c"/><text x="18" y="32" class="k">INPUT</text><text x="18" y="65" class="n">MNIST image</text><text x="18" y="94" class="d">28 × 28 × 1</text><rect x="46" y="119" width="58" height="46" rx="7" fill="none" stroke="#2698ba" stroke-width="3"/><path d="M65 119v46M85 119v46M46 135h58M46 150h58" stroke="#2698ba" stroke-width="2"/></g><path d="M192 241h30" class="a"/>
  <g transform="translate(230 146)"><rect width="310" height="190" rx="16" class="c"/><text x="18" y="32" class="k">DEEP CONVOLUTION STACK</text><text x="18" y="65" class="n">32 → 64 → 64 → 128 → 32</text><text x="18" y="96" class="d">3 × 3 · stride 1 · ReLU</text><text x="18" y="122" class="d">Same padding</text><text x="18" y="153" class="n">28 × 28 spatial size</text></g><path d="M540 241h30" class="a"/>
  <g transform="translate(578 146)"><rect width="145" height="190" rx="16" class="c"/><text x="18" y="32" class="k">FLATTEN</text><text x="18" y="65" class="n">25,088</text><text x="18" y="94" class="d">features</text><path d="M36 128h73M36 148h73M72 118v40" stroke="#2698ba" stroke-width="3"/></g><path d="M723 241h30" class="a"/>
  <g transform="translate(761 146)"><rect width="155" height="190" rx="16" class="c"/><text x="18" y="32" class="k">DENSE</text><text x="18" y="65" class="n">100 units</text><text x="18" y="94" class="d">Linear activation</text><g fill="#2698ba"><circle cx="44" cy="136" r="7"/><circle cx="78" cy="136" r="7"/><circle cx="112" cy="136" r="7"/></g></g><path d="M916 241h30" class="a"/>
  <g transform="translate(954 146)"><rect width="204" height="190" rx="16" class="z"/><text x="18" y="32" class="k">LATENT SPACE</text><text x="18" y="65" class="n">μ and σ → z</text><text x="18" y="94" class="d">Reparametrization</text><text x="18" y="125" class="n">Dimension 2</text><circle cx="164" cy="74" r="17" fill="none" stroke="#2698ba" stroke-width="3"/><circle cx="164" cy="126" r="17" fill="none" stroke="#2698ba" stroke-width="3"/></g>
  <text x="42" y="414" class="r">DECODER</text>
  <g transform="translate(42 434)"><rect width="150" height="190" rx="16" class="z"/><text x="18" y="32" class="k">LATENT INPUT</text><text x="18" y="65" class="n">z₁, z₂</text><text x="18" y="94" class="d">Shape 2</text><circle cx="52" cy="138" r="14" fill="none" stroke="#2698ba" stroke-width="3"/><circle cx="99" cy="138" r="14" fill="none" stroke="#2698ba" stroke-width="3"/></g><path d="M192 529h30" class="a"/>
  <g transform="translate(230 434)"><rect width="190" height="190" rx="16" class="c"/><text x="18" y="32" class="k">DENSE</text><text x="18" y="65" class="n">25,088 units</text><text x="18" y="94" class="d">ReLU activation</text><g fill="#2698ba"><circle cx="48" cy="138" r="7"/><circle cx="84" cy="138" r="7"/><circle cx="120" cy="138" r="7"/><circle cx="156" cy="138" r="7"/></g></g><path d="M420 529h30" class="a"/>
  <g transform="translate(458 434)"><rect width="175" height="190" rx="16" class="c"/><text x="18" y="32" class="k">RESHAPE</text><text x="18" y="65" class="n">28 × 28 × 32</text><text x="18" y="94" class="d">Feature maps</text><path d="M46 128h68l15 15H61Z" fill="none" stroke="#2698ba" stroke-width="3"/><path d="M46 143h68l15 15H61Z" fill="none" stroke="#2698ba" stroke-width="3"/></g><path d="M633 529h30" class="a"/>
  <g transform="translate(671 434)"><rect width="355" height="190" rx="16" class="c"/><text x="18" y="32" class="k">DEEP TRANSPOSE-CONVOLUTION STACK</text><text x="18" y="65" class="n">32 → 64 → 64 → 128 → 64 → 1</text><text x="18" y="96" class="d">3 × 3 · stride 1 · same padding</text><text x="18" y="122" class="d">ReLU, then sigmoid output</text><text x="18" y="153" class="n">28 × 28 × 1</text></g><path d="M1026 529h30" class="a"/>
  <g transform="translate(1064 434)"><rect width="94" height="190" rx="16" class="c"/><text x="13" y="32" class="k">OUTPUT</text><text x="13" y="65" class="n">Digit</text><text x="13" y="94" class="d">28 × 28</text><rect x="22" y="116" width="50" height="50" rx="7" fill="none" stroke="#2698ba" stroke-width="3"/></g>
  <text x="42" y="692" class="s">The deeper model keeps the spatial size fixed with same padding while changing the channel depth.</text>
</svg>
