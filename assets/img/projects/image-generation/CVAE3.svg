<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1430" role="img" aria-labelledby="cvae3-title cvae3-desc"><title id="cvae3-title">CVAE-3 architecture</title><desc id="cvae3-desc">A deeper five-layer convolutional encoder maps MNIST images to a two-dimensional latent space. A corresponding transpose-convolutional decoder reconstructs the image.</desc><defs><marker id="cvae3-arrow" markerWidth="16" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 14 6 0 12Z" fill="#2698ba" stroke="none" /></marker><style>.h{fill:#f8f9fa;font:700 36px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.s{fill:#a8aaad;font:400 18px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.r{fill:#2698ba;font:700 15px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.8px}.k{fill:#2698ba;font:700 14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.3px}.n{fill:#f8f9fa;font:700 22px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.d{fill:#a8aaad;font:400 17px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.c{fill:#212529;stroke:#3a3f44;stroke-width:2}.z{fill:#222d31;stroke:#2698ba;stroke-width:2}.a{fill:none;stroke:#2698ba;stroke-width:4;stroke-linecap: butt; marker-end:url(#cvae3-arrow)}</style></defs><rect width="1200" height="1430" rx="28" fill="#1c1c1d"/><text x="60" y="62" class="h">CVAE-3 · deeper convolutional path</text><text x="60" y="94" class="s">Five encoder stages, a two-dimensional latent space, and a mirrored decoder</text><text x="60" y="133" class="r">ENCODER</text><g transform="translate(40 155)"><rect width="320" height="200" rx="18" class="c"/><text x="24" y="38" class="k">INPUT</text><text x="24" y="81" class="n">MNIST image</text><text x="24" y="115" class="d">28 × 28 × 1</text></g><path d="M360 255h50" class="a"/><g transform="translate(430 155)"><rect width="320" height="200" rx="18" class="c"/><text x="24" y="38" class="k">DEEP CONVOLUTION STACK</text><text x="24" y="81" class="n">32 → 64 → 64 → 128 → 32</text><text x="24" y="115" class="d">3 × 3 · stride 1 · ReLU</text><text x="24" y="145" class="d">Same padding · 28 × 28</text></g><path d="M750 255h50" class="a"/><g transform="translate(820 155)"><rect width="320" height="200" rx="18" class="c"/><text x="24" y="38" class="k">FLATTEN</text><text x="24" y="81" class="n">25,088 features</text><text x="24" y="115" class="d">28 × 28 × 32 → vector</text></g><path d="M980 355v75" class="a"/><g transform="translate(820 450)"><rect width="320" height="200" rx="18" class="c"/><text x="24" y="38" class="k">ENCODER DENSE</text><text x="24" y="81" class="n">100 units</text><text x="24" y="115" class="d">Linear activation</text></g><path d="M820 550h-50" class="a"/><g transform="translate(430 450)"><rect width="320" height="200" rx="18" class="z"/><text x="24" y="38" class="k">LATENT SPACE</text><text x="24" y="81" class="n">μ and σ → z</text><text x="24" y="115" class="d">Reparametrization · dimension 2</text></g><text x="60" y="763" class="r">DECODER</text><path d="M590 650v130" class="a"/><g transform="translate(430 800)"><rect width="320" height="200" rx="18" class="z"/><text x="24" y="38" class="k">LATENT INPUT</text><text x="24" y="81" class="n">z₁, z₂</text><text x="24" y="115" class="d">Shape 2</text></g><path d="M750 900h50" class="a"/><g transform="translate(820 800)"><rect width="320" height="200" rx="18" class="c"/><text x="24" y="38" class="k">DENSE AND RESHAPE</text><text x="24" y="81" class="n">25,088 units · ReLU</text><text x="24" y="115" class="d">Reshape to 28 × 28 × 32</text></g><path d="M980 1000v250h-210" class="a"/><g transform="translate(430 1150)"><rect width="320" height="200" rx="18" class="c"/><text x="24" y="38" class="k">DEEP TRANSPOSE-CONVOLUTION STACK</text><text x="24" y="81" class="n">32 → 64 → 64 → 128 → 64 → 1</text><text x="24" y="115" class="d">3 × 3 · stride 1 · same padding</text><text x="24" y="145" class="d">ReLU, then sigmoid output</text></g><path d="M430 1250h-50" class="a"/><g transform="translate(40 1150)"><rect width="320" height="200" rx="18" class="c"/><text x="24" y="38" class="k">OUTPUT</text><text x="24" y="81" class="n">Reconstructed digit</text><text x="24" y="115" class="d">28 × 28 × 1</text></g><text x="60" y="1400" class="s">The deeper model keeps the spatial size fixed with same padding while changing the channel depth.</text></svg>
