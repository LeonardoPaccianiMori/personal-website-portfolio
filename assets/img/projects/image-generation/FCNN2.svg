<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="fcnn2-title fcnn2-desc">
  <title id="fcnn2-title">FCNN-2 architecture</title>
  <desc id="fcnn2-desc">MNIST input passes through five three-by-three convolutional layers and global average pooling to a ten-class softmax output.</desc>
  <defs><marker id="fcnn2-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 7 3 0 6Z" fill="#2698ba"/></marker><style>.h{fill:#f8f9fa;font:700 30px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.s{fill:#a8aaad;font:400 16px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.k{fill:#2698ba;font:700 11px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.1px}.n{fill:#f8f9fa;font:700 15px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.d{fill:#a8aaad;font:400 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.c{fill:#212529;stroke:#3a3f44;stroke-width:2}.a{fill:none;stroke:#2698ba;stroke-width:3;marker-end:url(#fcnn2-arrow)}</style></defs>
  <rect width="1200" height="500" rx="28" fill="#1c1c1d"/><text x="38" y="58" class="h">FCNN-2 · deeper global-pooling model</text><text x="38" y="88" class="s">Five three-by-three convolutional layers and global average pooling</text>
  <g transform="translate(38 132)"><rect width="120" height="250" rx="16" class="c"/><text x="16" y="34" class="k">INPUT</text><text x="16" y="68" class="n">MNIST</text><text x="16" y="96" class="d">28 × 28 × 1</text><rect x="31" y="135" width="58" height="58" rx="7" fill="none" stroke="#2698ba" stroke-width="3"/><path d="M50 135v58M70 135v58M31 154h58M31 174h58" stroke="#2698ba" stroke-width="2"/></g><path d="M158 257h16" class="a"/>
  <g transform="translate(180 132)"><rect width="136" height="250" rx="16" class="c"/><text x="16" y="34" class="k">CONV 1</text><text x="16" y="68" class="n">5 filters</text><text x="16" y="98" class="d">3 × 3 · ReLU</text><text x="16" y="128" class="d">Stride 1</text><text x="16" y="195" class="n">26 × 26 × 5</text></g><path d="M316 257h16" class="a"/>
  <g transform="translate(338 132)"><rect width="136" height="250" rx="16" class="c"/><text x="16" y="34" class="k">CONV 2</text><text x="16" y="68" class="n">10 filters</text><text x="16" y="98" class="d">3 × 3 · ReLU</text><text x="16" y="128" class="d">Stride 1</text><text x="16" y="195" class="n">24 × 24 × 10</text></g><path d="M474 257h16" class="a"/>
  <g transform="translate(496 132)"><rect width="136" height="250" rx="16" class="c"/><text x="16" y="34" class="k">CONV 3</text><text x="16" y="68" class="n">10 filters</text><text x="16" y="98" class="d">3 × 3 · ReLU</text><text x="16" y="128" class="d">Stride 1</text><text x="16" y="195" class="n">22 × 22 × 10</text></g><path d="M632 257h16" class="a"/>
  <g transform="translate(654 132)"><rect width="136" height="250" rx="16" class="c"/><text x="16" y="34" class="k">CONV 4</text><text x="16" y="68" class="n">5 filters</text><text x="16" y="98" class="d">3 × 3 · ReLU</text><text x="16" y="128" class="d">Stride 1</text><text x="16" y="195" class="n">20 × 20 × 5</text></g><path d="M790 257h16" class="a"/>
  <g transform="translate(812 132)"><rect width="136" height="250" rx="16" class="c"/><text x="16" y="34" class="k">CONV 5</text><text x="16" y="68" class="n">10 filters</text><text x="16" y="98" class="d">3 × 3 · ReLU</text><text x="16" y="128" class="d">Stride 1</text><text x="16" y="195" class="n">18 × 18 × 10</text></g><path d="M948 257h16" class="a"/>
  <g transform="translate(970 132)"><rect width="192" height="250" rx="16" class="c"/><text x="16" y="34" class="k">GLOBAL POOLING</text><text x="16" y="68" class="n">10 class scores</text><text x="16" y="98" class="d">Average feature maps</text><text x="16" y="128" class="d">Softmax</text><path d="M23 170h50M23 190h50M84 180h34" stroke="#2698ba" stroke-width="3"/><circle cx="140" cy="180" r="13" fill="none" stroke="#2698ba" stroke-width="3"/></g>
  <text x="38" y="444" class="s">All convolutions use stride one, ReLU activation, and no padding.</text>
</svg>
