<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="cnn1-title cnn1-desc">
  <title id="cnn1-title">CNN-1 architecture</title>
  <desc id="cnn1-desc">MNIST input passes through three convolutional layers, flattening, and a ten-class softmax layer.</desc>
  <defs>
    <marker id="cnn1-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 7 3 0 6Z" fill="#2698ba" /></marker>
    <style>
      .h { fill: #f8f9fa; font: 700 30px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .s { fill: #a8aaad; font: 400 16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .k { fill: #2698ba; font: 700 12px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.4px; }
      .n { fill: #f8f9fa; font: 700 17px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .d { fill: #a8aaad; font: 400 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .c { fill: #212529; stroke: #3a3f44; stroke-width: 2; }
      .a { fill: none; stroke: #2698ba; stroke-width: 3; marker-end: url(#cnn1-arrow); }
    </style>
  </defs>
  <rect width="1200" height="500" rx="28" fill="#1c1c1d" />
  <text x="48" y="58" class="h">CNN-1 · baseline classifier</text>
  <text x="48" y="88" class="s">Three convolutional layers and one fully connected output layer</text>
  <g transform="translate(48 132)"><rect width="150" height="250" rx="16" class="c" /><text x="20" y="34" class="k">INPUT</text><text x="20" y="70" class="n">MNIST image</text><text x="20" y="105" class="d">28 × 28 × 1</text><rect x="42" y="140" width="66" height="66" rx="8" fill="none" stroke="#2698ba" stroke-width="3" /><path d="M64 140v66M86 140v66M42 162h66M42 184h66" stroke="#2698ba" stroke-width="2" /></g>
  <path d="M198 257h25" class="a" />
  <g transform="translate(230 132)"><rect width="170" height="250" rx="16" class="c" /><text x="20" y="34" class="k">CONVOLUTION 1</text><text x="20" y="70" class="n">5 filters</text><text x="20" y="103" class="d">Kernel 3 × 3</text><text x="20" y="128" class="d">Stride 1 · ReLU</text><text x="20" y="153" class="d">No padding</text><text x="20" y="203" class="n">26 × 26 × 5</text></g>
  <path d="M400 257h25" class="a" />
  <g transform="translate(432 132)"><rect width="170" height="250" rx="16" class="c" /><text x="20" y="34" class="k">CONVOLUTION 2</text><text x="20" y="70" class="n">10 filters</text><text x="20" y="103" class="d">Kernel 3 × 3</text><text x="20" y="128" class="d">Stride 1 · ReLU</text><text x="20" y="153" class="d">No padding</text><text x="20" y="203" class="n">24 × 24 × 10</text></g>
  <path d="M602 257h25" class="a" />
  <g transform="translate(634 132)"><rect width="170" height="250" rx="16" class="c" /><text x="20" y="34" class="k">CONVOLUTION 3</text><text x="20" y="70" class="n">5 filters</text><text x="20" y="103" class="d">Kernel 3 × 3</text><text x="20" y="128" class="d">Stride 1 · ReLU</text><text x="20" y="153" class="d">No padding</text><text x="20" y="203" class="n">22 × 22 × 5</text></g>
  <path d="M804 257h25" class="a" />
  <g transform="translate(836 132)"><rect width="130" height="250" rx="16" class="c" /><text x="18" y="34" class="k">FLATTEN</text><text x="18" y="70" class="n">2,420</text><text x="18" y="103" class="d">features</text><path d="M38 145h54M38 165h54M38 185h54M65 137v57" stroke="#2698ba" stroke-width="3" /></g>
  <path d="M966 257h25" class="a" />
  <g transform="translate(998 132)"><rect width="154" height="250" rx="16" class="c" /><text x="18" y="34" class="k">CLASSIFIER</text><text x="18" y="70" class="n">Dense · 10</text><text x="18" y="103" class="d">Softmax</text><g fill="#2698ba"><circle cx="42" cy="150" r="6" /><circle cx="76" cy="150" r="6" /><circle cx="110" cy="150" r="6" /><circle cx="42" cy="182" r="6" /><circle cx="76" cy="182" r="6" /><circle cx="110" cy="182" r="6" /></g><text x="18" y="225" class="d">Digit classes 0–9</text></g>
  <text x="48" y="444" class="s">All convolutional layers use learned filters; the final distribution assigns one of ten digit classes.</text>
</svg>
