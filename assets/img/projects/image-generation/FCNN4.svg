<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-labelledby="fcnn4-title fcnn4-desc"><title id="fcnn4-title">FCNN-4 architecture</title><desc id="fcnn4-desc">MNIST input passes through five five-by-five convolutional layers and global average pooling to a ten-class softmax output.</desc><defs><marker id="fcnn4-arrow" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#2698ba"/></marker><style>.h{fill:#f8f9fa;font:700 36px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.s{fill:#a8aaad;font:400 18px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.k{fill:#2698ba;font:700 13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.3px}.n{fill:#f8f9fa;font:700 20px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.d{fill:#a8aaad;font:400 15px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.c{fill:#212529;stroke:#3a3f44;stroke-width:2}.a{fill:none;stroke:#2698ba;stroke-width:4;marker-end:url(#fcnn4-arrow)}</style></defs><rect width="1200" height="730" rx="28" fill="#1c1c1d"/><text x="50" y="62" class="h">FCNN-4 · deeper model with larger kernels</text><text x="50" y="94" class="s">Five five-by-five convolutional layers and global average pooling</text><g transform="translate(40 150)"><rect width="240" height="190" rx="18" class="c"/><text x="20" y="34" class="k">INPUT</text><text x="20" y="72" class="n">MNIST image</text><text x="20" y="102" class="d">28 × 28 × 1</text></g><path d="M280 245h30" class="a"/><g transform="translate(310 150)"><rect width="240" height="190" rx="18" class="c"/><text x="20" y="34" class="k">CONVOLUTION 1</text><text x="20" y="72" class="n">5 filters · 5 × 5</text><text x="20" y="102" class="d">Stride 1 · ReLU</text><text x="20" y="166" class="n">24 × 24 × 5</text></g><path d="M550 245h30" class="a"/><g transform="translate(580 150)"><rect width="240" height="190" rx="18" class="c"/><text x="20" y="34" class="k">CONVOLUTION 2</text><text x="20" y="72" class="n">10 filters · 5 × 5</text><text x="20" y="102" class="d">Stride 1 · ReLU</text><text x="20" y="166" class="n">20 × 20 × 10</text></g><path d="M820 245h30" class="a"/><g transform="translate(850 150)"><rect width="240" height="190" rx="18" class="c"/><text x="20" y="34" class="k">CONVOLUTION 3</text><text x="20" y="72" class="n">10 filters · 5 × 5</text><text x="20" y="102" class="d">Stride 1 · ReLU</text><text x="20" y="166" class="n">16 × 16 × 10</text></g><path d="M1090 245h70v290h-70" class="a"/><g transform="translate(40 440)"><rect width="240" height="190" rx="18" class="c"/><text x="20" y="34" class="k">OUTPUT</text><text x="20" y="72" class="n">10 class scores</text><text x="20" y="102" class="d">Softmax activation</text></g><g transform="translate(310 440)"><rect width="240" height="190" rx="18" class="c"/><text x="20" y="34" class="k">GLOBAL AVERAGE POOLING</text><text x="20" y="72" class="n">Feature-map averages</text><text x="20" y="102" class="d">8 × 8 × 10 → 10</text></g><g transform="translate(580 440)"><rect width="240" height="190" rx="18" class="c"/><text x="20" y="34" class="k">CONVOLUTION 5</text><text x="20" y="72" class="n">10 filters · 5 × 5</text><text x="20" y="102" class="d">Stride 1 · ReLU</text><text x="20" y="166" class="n">8 × 8 × 10</text></g><g transform="translate(850 440)"><rect width="240" height="190" rx="18" class="c"/><text x="20" y="34" class="k">CONVOLUTION 4</text><text x="20" y="72" class="n">5 filters · 5 × 5</text><text x="20" y="102" class="d">Stride 1 · ReLU</text><text x="20" y="166" class="n">12 × 12 × 5</text></g><path d="M850 535h-30M580 535h-30M310 535h-30" class="a"/><text x="50" y="686" class="s">All convolutions use stride one, ReLU activation, and no padding.</text></svg>
