<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="cnn3-title cnn3-desc">
  <title id="cnn3-title">CNN-3 architecture</title>
  <desc id="cnn3-desc">MNIST input passes through three convolutional layers, flattening, two ReLU dense layers, and a ten-class softmax layer.</desc>
  <defs><marker id="cnn3-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 7 3 0 6Z" fill="#2698ba"/></marker><style>.h{fill:#f8f9fa;font:700 30px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.s{fill:#a8aaad;font:400 16px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.k{fill:#2698ba;font:700 11px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.1px}.n{fill:#f8f9fa;font:700 16px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.d{fill:#a8aaad;font:400 12.5px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.c{fill:#212529;stroke:#3a3f44;stroke-width:2}.a{fill:none;stroke:#2698ba;stroke-width:3;marker-end:url(#cnn3-arrow)}</style></defs>
  <rect width="1200" height="500" rx="28" fill="#1c1c1d"/><text x="38" y="58" class="h">CNN-3 · larger dense head</text><text x="38" y="88" class="s">Three convolutional layers and three fully connected layers</text>
  <g transform="translate(38 132)"><rect width="120" height="250" rx="16" class="c"/><text x="16" y="34" class="k">INPUT</text><text x="16" y="68" class="n">MNIST</text><text x="16" y="96" class="d">28 × 28 × 1</text><rect x="31" y="135" width="58" height="58" rx="7" fill="none" stroke="#2698ba" stroke-width="3"/><path d="M50 135v58M70 135v58M31 154h58M31 174h58" stroke="#2698ba" stroke-width="2"/></g><path d="M158 257h17" class="a"/>
  <g transform="translate(182 132)"><rect width="142" height="250" rx="16" class="c"/><text x="16" y="34" class="k">CONV 1</text><text x="16" y="68" class="n">5 · 3 × 3</text><text x="16" y="99" class="d">Stride 1 · ReLU</text><text x="16" y="129" class="d">No padding</text><text x="16" y="195" class="n">26 × 26 × 5</text></g><path d="M324 257h17" class="a"/>
  <g transform="translate(348 132)"><rect width="142" height="250" rx="16" class="c"/><text x="16" y="34" class="k">CONV 2</text><text x="16" y="68" class="n">10 · 3 × 3</text><text x="16" y="99" class="d">Stride 1 · ReLU</text><text x="16" y="129" class="d">No padding</text><text x="16" y="195" class="n">24 × 24 × 10</text></g><path d="M490 257h17" class="a"/>
  <g transform="translate(514 132)"><rect width="142" height="250" rx="16" class="c"/><text x="16" y="34" class="k">CONV 3</text><text x="16" y="68" class="n">5 · 3 × 3</text><text x="16" y="99" class="d">Stride 1 · ReLU</text><text x="16" y="129" class="d">No padding</text><text x="16" y="195" class="n">22 × 22 × 5</text></g><path d="M656 257h17" class="a"/>
  <g transform="translate(680 132)"><rect width="105" height="250" rx="16" class="c"/><text x="14" y="34" class="k">FLATTEN</text><text x="14" y="68" class="n">2,420</text><text x="14" y="96" class="d">features</text><path d="M27 145h51M27 165h51M52 137v57" stroke="#2698ba" stroke-width="3"/></g><path d="M785 257h17" class="a"/>
  <g transform="translate(809 132)"><rect width="105" height="250" rx="16" class="c"/><text x="14" y="34" class="k">DENSE 1</text><text x="14" y="68" class="n">30</text><text x="14" y="96" class="d">ReLU</text><g fill="#2698ba"><circle cx="32" cy="150" r="6"/><circle cx="72" cy="150" r="6"/><circle cx="32" cy="182" r="6"/><circle cx="72" cy="182" r="6"/></g></g><path d="M914 257h17" class="a"/>
  <g transform="translate(938 132)"><rect width="105" height="250" rx="16" class="c"/><text x="14" y="34" class="k">DENSE 2</text><text x="14" y="68" class="n">20</text><text x="14" y="96" class="d">ReLU</text><g fill="#2698ba"><circle cx="32" cy="150" r="6"/><circle cx="72" cy="150" r="6"/><circle cx="32" cy="182" r="6"/><circle cx="72" cy="182" r="6"/></g></g><path d="M1043 257h17" class="a"/>
  <g transform="translate(1067 132)"><rect width="95" height="250" rx="16" class="c"/><text x="13" y="34" class="k">OUTPUT</text><text x="13" y="68" class="n">10</text><text x="13" y="96" class="d">Softmax</text><g fill="#2698ba"><circle cx="28" cy="150" r="6"/><circle cx="65" cy="150" r="6"/><circle cx="28" cy="182" r="6"/><circle cx="65" cy="182" r="6"/></g></g>
  <text x="38" y="444" class="s">The convolutional backbone matches CNN-1; two additional dense layers expand the classifier head.</text>
</svg>
