<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1120" role="img" aria-labelledby="dcgan1-title dcgan1-desc">
  <title id="dcgan1-title">DCGAN-1 architecture</title><desc id="dcgan1-desc">A three-stage generator with tanh output and a three-stage discriminator.</desc>
  <defs><marker id="dcgan1-arrow" markerWidth="16" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 14 6 0 12Z" fill="#2698ba" stroke="none" /></marker><style>.h{fill:#f8f9fa;font:700 36px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.s{fill:#a8aaad;font:400 18px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.r{fill:#2698ba;font:700 15px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.8px}.k{fill:#2698ba;font:700 14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.2px}.n{fill:#f8f9fa;font:700 21px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.d{fill:#a8aaad;font:400 16px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.c{fill:#212529;stroke:#3a3f44;stroke-width:2}.z{fill:#222d31;stroke:#2698ba;stroke-width:2}.a{fill:none;stroke:#2698ba;stroke-width:4;stroke-linecap: butt; marker-end:url(#dcgan1-arrow)}</style></defs>
  <rect width="1200" height="1120" rx="28" fill="#1c1c1d"/><text x="60" y="62" class="h">DCGAN-1 · tanh baseline</text><text x="60" y="94" class="s">Three convolutional stages in the generator and discriminator</text>
  <text x="60" y="140" class="r">GENERATOR</text>
  <g transform="translate(40 165)"><rect width="245" height="190" rx="18" class="z"/><text x="22" y="38" class="k">LATENT INPUT</text><text x="22" y="80" class="n">Noise vector</text><text x="22" y="114" class="d">Sampled latent code</text></g><path d="M285 260h35" class="a"/>
  <g transform="translate(340 165)"><rect width="245" height="190" rx="18" class="c"/><text x="22" y="38" class="k">DENSE AND RESHAPE</text><text x="22" y="80" class="n">Learned seed map</text><text x="22" y="114" class="d">Vector → spatial features</text></g><path d="M585 260h35" class="a"/>
  <g transform="translate(640 165)"><rect width="245" height="190" rx="18" class="c"/><text x="22" y="38" class="k">GENERATOR STACK</text><text x="22" y="80" class="n">3 conv stages</text><text x="22" y="114" class="d">Upsample feature maps</text></g><path d="M885 260h35" class="a"/>
  <g transform="translate(940 165)"><rect width="220" height="190" rx="18" class="z"/><text x="22" y="38" class="k">GENERATED IMAGE</text><text x="22" y="80" class="n">28 × 28 × 1</text><text x="22" y="114" class="d">Tanh · range [-1, 1]</text></g><path d="M1050 355v165" class="a"/>
  <text x="60" y="510" class="r">DISCRIMINATOR</text>
  <g transform="translate(940 540)"><rect width="220" height="190" rx="18" class="z"/><text x="22" y="38" class="k">IMAGE INPUT</text><text x="22" y="80" class="n">Real or generated</text><text x="22" y="114" class="d">28 × 28 × 1</text></g><path d="M940 635h-35" class="a"/>
  <g transform="translate(640 540)"><rect width="245" height="190" rx="18" class="c"/><text x="22" y="38" class="k">DISCRIMINATOR STACK</text><text x="22" y="80" class="n">3 conv stages</text><text x="22" y="114" class="d">Downsample features</text></g><path d="M640 635h-35" class="a"/>
  <g transform="translate(340 540)"><rect width="245" height="190" rx="18" class="c"/><text x="22" y="38" class="k">FLATTEN</text><text x="22" y="80" class="n">Feature vector</text><text x="22" y="114" class="d">Spatial map → vector</text></g><path d="M340 635h-35" class="a"/>
  <g transform="translate(40 540)"><rect width="245" height="190" rx="18" class="z"/><text x="22" y="38" class="k">DECISION</text><text x="22" y="80" class="n">Real or generated</text><text x="22" y="114" class="d">Binary probability</text></g>
  <g transform="translate(40 815)"><rect width="1120" height="190" rx="18" class="c"/><text x="24" y="40" class="k">TRAINING CONFIGURATION</text><text x="24" y="84" class="n">Tanh output paired with input scaling to [-1, 1]</text><text x="24" y="120" class="d">100 epochs · sequential baseline for the later DCGAN configurations</text><text x="24" y="152" class="d">The diagram shows the image path; generator and discriminator are trained adversarially.</text></g>
</svg>
