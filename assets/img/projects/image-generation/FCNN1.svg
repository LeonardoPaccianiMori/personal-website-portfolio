<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="fcnn1-title fcnn1-desc">
  <title id="fcnn1-title">FCNN-1 architecture</title>
  <desc id="fcnn1-desc">MNIST input passes through three convolutional layers and global average pooling to a ten-class softmax output.</desc>
  <defs><marker id="fcnn1-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 7 3 0 6Z" fill="#2698ba"/></marker><style>.h{fill:#f8f9fa;font:700 30px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.s{fill:#a8aaad;font:400 16px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.k{fill:#2698ba;font:700 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.3px}.n{fill:#f8f9fa;font:700 17px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.d{fill:#a8aaad;font:400 13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.c{fill:#212529;stroke:#3a3f44;stroke-width:2}.a{fill:none;stroke:#2698ba;stroke-width:3;marker-end:url(#fcnn1-arrow)}</style></defs>
  <rect width="1200" height="500" rx="28" fill="#1c1c1d"/><text x="48" y="58" class="h">FCNN-1 · global-pooling baseline</text><text x="48" y="88" class="s">Three convolutional layers with no dense classifier head</text>
  <g transform="translate(48 132)"><rect width="150" height="250" rx="16" class="c"/><text x="20" y="34" class="k">INPUT</text><text x="20" y="70" class="n">MNIST image</text><text x="20" y="105" class="d">28 × 28 × 1</text><rect x="42" y="140" width="66" height="66" rx="8" fill="none" stroke="#2698ba" stroke-width="3"/><path d="M64 140v66M86 140v66M42 162h66M42 184h66" stroke="#2698ba" stroke-width="2"/></g><path d="M198 257h25" class="a"/>
  <g transform="translate(230 132)"><rect width="170" height="250" rx="16" class="c"/><text x="20" y="34" class="k">CONVOLUTION 1</text><text x="20" y="70" class="n">5 · 3 × 3</text><text x="20" y="103" class="d">Stride 1 · ReLU</text><text x="20" y="133" class="d">No padding</text><text x="20" y="203" class="n">26 × 26 × 5</text></g><path d="M400 257h25" class="a"/>
  <g transform="translate(432 132)"><rect width="170" height="250" rx="16" class="c"/><text x="20" y="34" class="k">CONVOLUTION 2</text><text x="20" y="70" class="n">10 · 3 × 3</text><text x="20" y="103" class="d">Stride 1 · ReLU</text><text x="20" y="133" class="d">No padding</text><text x="20" y="203" class="n">24 × 24 × 10</text></g><path d="M602 257h25" class="a"/>
  <g transform="translate(634 132)"><rect width="170" height="250" rx="16" class="c"/><text x="20" y="34" class="k">CONVOLUTION 3</text><text x="20" y="70" class="n">10 · 3 × 3</text><text x="20" y="103" class="d">Stride 1 · ReLU</text><text x="20" y="133" class="d">No padding</text><text x="20" y="203" class="n">22 × 22 × 10</text></g><path d="M804 257h25" class="a"/>
  <g transform="translate(836 132)"><rect width="316" height="250" rx="16" class="c"/><text x="22" y="34" class="k">GLOBAL AVERAGE POOLING</text><text x="22" y="72" class="n">10 class scores</text><text x="22" y="105" class="d">Average each feature map</text><text x="22" y="133" class="d">Softmax activation</text><path d="M26 174h64M26 194h64M104 184h48" stroke="#2698ba" stroke-width="3"/><circle cx="176" cy="184" r="13" fill="none" stroke="#2698ba" stroke-width="3"/><g fill="#2698ba"><circle cx="226" cy="168" r="6"/><circle cx="254" cy="168" r="6"/><circle cx="282" cy="168" r="6"/><circle cx="226" cy="198" r="6"/><circle cx="254" cy="198" r="6"/><circle cx="282" cy="198" r="6"/></g></g>
  <text x="48" y="444" class="s">Global average pooling maps the final feature maps directly to the ten digit classes.</text>
</svg>
