<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="cvae1-title cvae1-desc">
  <title id="cvae1-title">CVAE-1 architecture</title>
  <desc id="cvae1-desc">A three-layer convolutional encoder maps MNIST images to a two-dimensional latent space. A dense layer and four transpose-convolutional layers reconstruct the image.</desc>
  <defs><marker id="cvae1-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 7 3 0 6Z" fill="#2698ba"/></marker><style>.h{fill:#f8f9fa;font:700 30px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.s{fill:#a8aaad;font:400 16px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.r{fill:#2698ba;font:700 13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.5px}.k{fill:#2698ba;font:700 11px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.1px}.n{fill:#f8f9fa;font:700 16px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.d{fill:#a8aaad;font:400 12.5px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.c{fill:#212529;stroke:#3a3f44;stroke-width:2}.z{fill:#222d31;stroke:#2698ba;stroke-width:2}.a{fill:none;stroke:#2698ba;stroke-width:3;marker-end:url(#cvae1-arrow)}</style></defs>
  <rect width="1200" height="760" rx="28" fill="#1c1c1d"/><text x="42" y="54" class="h">CVAE-1 · baseline conditional autoencoder</text><text x="42" y="84" class="s">A two-dimensional latent space between a convolutional encoder and decoder</text>
  <text x="42" y="126" class="r">ENCODER</text>
  <g transform="translate(42 146)"><rect width="150" height="190" rx="16" class="c"/><text x="18" y="32" class="k">INPUT</text><text x="18" y="65" class="n">MNIST image</text><text x="18" y="94" class="d">28 × 28 × 1</text><rect x="46" y="119" width="58" height="46" rx="7" fill="none" stroke="#2698ba" stroke-width="3"/><path d="M65 119v46M85 119v46M46 135h58M46 150h58" stroke="#2698ba" stroke-width="2"/></g><path d="M192 241h30" class="a"/>
  <g transform="translate(230 146)"><rect width="270" height="190" rx="16" class="c"/><text x="18" y="32" class="k">CONVOLUTION STACK</text><text x="18" y="65" class="n">32 → 64 → 32 filters</text><text x="18" y="96" class="d">3 × 3 · stride 1 · ReLU</text><text x="18" y="122" class="d">Same padding</text><text x="18" y="153" class="n">28 × 28 spatial size</text></g><path d="M500 241h30" class="a"/>
  <g transform="translate(538 146)"><rect width="150" height="190" rx="16" class="c"/><text x="18" y="32" class="k">FLATTEN</text><text x="18" y="65" class="n">25,088</text><text x="18" y="94" class="d">features</text><path d="M38 128h74M38 148h74M75 118v40" stroke="#2698ba" stroke-width="3"/></g><path d="M688 241h30" class="a"/>
  <g transform="translate(726 146)"><rect width="170" height="190" rx="16" class="c"/><text x="18" y="32" class="k">DENSE</text><text x="18" y="65" class="n">100 units</text><text x="18" y="94" class="d">Linear activation</text><g fill="#2698ba"><circle cx="48" cy="136" r="7"/><circle cx="85" cy="136" r="7"/><circle cx="122" cy="136" r="7"/></g></g><path d="M896 241h30" class="a"/>
  <g transform="translate(934 146)"><rect width="224" height="190" rx="16" class="z"/><text x="18" y="32" class="k">LATENT SPACE</text><text x="18" y="65" class="n">μ and σ → z</text><text x="18" y="94" class="d">Reparametrization</text><text x="18" y="125" class="n">Dimension 2</text><circle cx="178" cy="74" r="18" fill="none" stroke="#2698ba" stroke-width="3"/><circle cx="178" cy="127" r="18" fill="none" stroke="#2698ba" stroke-width="3"/><text x="172" y="80" class="d">z₁</text><text x="172" y="133" class="d">z₂</text></g>
  <text x="42" y="414" class="r">DECODER</text>
  <g transform="translate(42 434)"><rect width="150" height="190" rx="16" class="z"/><text x="18" y="32" class="k">LATENT INPUT</text><text x="18" y="65" class="n">z₁, z₂</text><text x="18" y="94" class="d">Shape 2</text><circle cx="52" cy="138" r="14" fill="none" stroke="#2698ba" stroke-width="3"/><circle cx="99" cy="138" r="14" fill="none" stroke="#2698ba" stroke-width="3"/></g><path d="M192 529h30" class="a"/>
  <g transform="translate(230 434)"><rect width="210" height="190" rx="16" class="c"/><text x="18" y="32" class="k">DENSE</text><text x="18" y="65" class="n">25,088 units</text><text x="18" y="94" class="d">ReLU activation</text><g fill="#2698ba"><circle cx="54" cy="138" r="7"/><circle cx="94" cy="138" r="7"/><circle cx="134" cy="138" r="7"/><circle cx="174" cy="138" r="7"/></g></g><path d="M440 529h30" class="a"/>
  <g transform="translate(478 434)"><rect width="180" height="190" rx="16" class="c"/><text x="18" y="32" class="k">RESHAPE</text><text x="18" y="65" class="n">28 × 28 × 32</text><text x="18" y="94" class="d">Feature maps</text><path d="M48 128h72l16 16H64Z" fill="none" stroke="#2698ba" stroke-width="3"/><path d="M48 143h72l16 16H64Z" fill="none" stroke="#2698ba" stroke-width="3"/></g><path d="M658 529h30" class="a"/>
  <g transform="translate(696 434)"><rect width="300" height="190" rx="16" class="c"/><text x="18" y="32" class="k">TRANSPOSE-CONVOLUTION STACK</text><text x="18" y="65" class="n">32 → 64 → 32 → 1 filters</text><text x="18" y="96" class="d">3 × 3 · stride 1 · same padding</text><text x="18" y="122" class="d">ReLU, then sigmoid output</text><text x="18" y="153" class="n">28 × 28 × 1</text></g><path d="M996 529h30" class="a"/>
  <g transform="translate(1034 434)"><rect width="124" height="190" rx="16" class="c"/><text x="16" y="32" class="k">OUTPUT</text><text x="16" y="65" class="n">Digit</text><text x="16" y="94" class="d">28 × 28</text><rect x="33" y="116" width="58" height="50" rx="7" fill="none" stroke="#2698ba" stroke-width="3"/></g>
  <text x="42" y="692" class="s">The diagram focuses on the image path and the two-dimensional latent representation.</text>
</svg>
