<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-labelledby="cnn2-title cnn2-desc"><title id="cnn2-title">CNN-2 architecture</title><desc id="cnn2-desc">MNIST input passes through five convolutional layers, flattening, and a ten-class softmax layer.</desc><defs><marker id="cnn2-arrow" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#2698ba"/></marker><style>.h{fill:#f8f9fa;font:700 36px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.s{fill:#a8aaad;font:400 18px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.k{fill:#2698ba;font:700 13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.3px}.n{fill:#f8f9fa;font:700 20px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.d{fill:#a8aaad;font:400 15px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.c{fill:#212529;stroke:#3a3f44;stroke-width:2}.a{fill:none;stroke:#2698ba;stroke-width:4;marker-end:url(#cnn2-arrow)}</style></defs><rect width="1200" height="730" rx="28" fill="#1c1c1d"/><text x="50" y="62" class="h">CNN-2 · deeper classifier</text><text x="50" y="94" class="s">Five convolutional layers and one fully connected output layer</text><g transform="translate(50 150)"><rect width="240" height="190" rx="18" class="c"/><text x="20" y="34" class="k">INPUT</text><text x="20" y="72" class="n">MNIST image</text><text x="20" y="102" class="d">28 × 28 × 1</text></g><path d="M290 245h40" class="a"/><g transform="translate(330 150)"><rect width="240" height="190" rx="18" class="c"/><text x="20" y="34" class="k">CONVOLUTION 1</text><text x="20" y="72" class="n">5 · 3 × 3</text><text x="20" y="102" class="d">Stride 1 · ReLU</text><text x="20" y="130" class="d">No padding</text><text x="20" y="166" class="n">26 × 26 × 5</text></g><path d="M570 245h40" class="a"/><g transform="translate(610 150)"><rect width="240" height="190" rx="18" class="c"/><text x="20" y="34" class="k">CONVOLUTION 2</text><text x="20" y="72" class="n">10 · 3 × 3</text><text x="20" y="102" class="d">Stride 1 · ReLU</text><text x="20" y="130" class="d">No padding</text><text x="20" y="166" class="n">24 × 24 × 10</text></g><path d="M850 245h40" class="a"/><g transform="translate(890 150)"><rect width="240" height="190" rx="18" class="c"/><text x="20" y="34" class="k">CONVOLUTION 3</text><text x="20" y="72" class="n">10 · 5 × 5</text><text x="20" y="102" class="d">Stride 1 · ReLU</text><text x="20" y="130" class="d">No padding</text><text x="20" y="166" class="n">20 × 20 × 10</text></g><path d="M1130 245h32v290h-32" class="a"/><g transform="translate(50 440)"><rect width="240" height="190" rx="18" class="c"/><text x="20" y="34" class="k">CLASSIFIER</text><text x="20" y="72" class="n">Dense · 10</text><text x="20" y="102" class="d">Softmax activation</text></g><g transform="translate(330 440)"><rect width="240" height="190" rx="18" class="c"/><text x="20" y="34" class="k">FLATTEN</text><text x="20" y="72" class="n">980 features</text><text x="20" y="102" class="d">14 × 14 × 5 → vector</text></g><g transform="translate(610 440)"><rect width="240" height="190" rx="18" class="c"/><text x="20" y="34" class="k">CONVOLUTION 5</text><text x="20" y="72" class="n">5 · 3 × 3</text><text x="20" y="102" class="d">Stride 1 · ReLU</text><text x="20" y="130" class="d">No padding</text><text x="20" y="166" class="n">14 × 14 × 5</text></g><g transform="translate(890 440)"><rect width="240" height="190" rx="18" class="c"/><text x="20" y="34" class="k">CONVOLUTION 4</text><text x="20" y="72" class="n">10 · 5 × 5</text><text x="20" y="102" class="d">Stride 1 · ReLU</text><text x="20" y="130" class="d">No padding</text><text x="20" y="166" class="n">16 × 16 × 10</text></g><path d="M890 535h-40M610 535h-40M330 535h-40" class="a"/><text x="50" y="686" class="s">Larger kernels in the middle layers reduce the spatial representation before classification.</text></svg>
