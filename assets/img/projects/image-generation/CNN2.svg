<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="cnn2-title cnn2-desc">
  <title id="cnn2-title">CNN-2 architecture</title>
  <desc id="cnn2-desc">MNIST input passes through five convolutional layers, flattening, and a ten-class softmax layer.</desc>
  <defs><marker id="cnn2-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 7 3 0 6Z" fill="#2698ba" /></marker><style>.h{fill:#f8f9fa;font:700 30px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.s{fill:#a8aaad;font:400 16px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.k{fill:#2698ba;font:700 11px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.1px}.n{fill:#f8f9fa;font:700 16px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.d{fill:#a8aaad;font:400 12.5px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.c{fill:#212529;stroke:#3a3f44;stroke-width:2}.a{fill:none;stroke:#2698ba;stroke-width:3;marker-end:url(#cnn2-arrow)}</style></defs>
  <rect width="1200" height="500" rx="28" fill="#1c1c1d"/><text x="38" y="58" class="h">CNN-2 · deeper classifier</text><text x="38" y="88" class="s">Five convolutional layers and one fully connected output layer</text>
  <g transform="translate(38 132)"><rect width="120" height="250" rx="16" class="c"/><text x="16" y="34" class="k">INPUT</text><text x="16" y="68" class="n">MNIST</text><text x="16" y="96" class="d">28 × 28 × 1</text><rect x="31" y="135" width="58" height="58" rx="7" fill="none" stroke="#2698ba" stroke-width="3"/><path d="M50 135v58M70 135v58M31 154h58M31 174h58" stroke="#2698ba" stroke-width="2"/></g><path d="M158 257h16" class="a"/>
  <g transform="translate(180 132)"><rect width="136" height="250" rx="16" class="c"/><text x="16" y="34" class="k">CONV 1</text><text x="16" y="68" class="n">5 · 3 × 3</text><text x="16" y="99" class="d">Stride 1 · ReLU</text><text x="16" y="129" class="d">No padding</text><text x="16" y="195" class="n">26 × 26 × 5</text></g><path d="M316 257h16" class="a"/>
  <g transform="translate(338 132)"><rect width="136" height="250" rx="16" class="c"/><text x="16" y="34" class="k">CONV 2</text><text x="16" y="68" class="n">10 · 3 × 3</text><text x="16" y="99" class="d">Stride 1 · ReLU</text><text x="16" y="129" class="d">No padding</text><text x="16" y="195" class="n">24 × 24 × 10</text></g><path d="M474 257h16" class="a"/>
  <g transform="translate(496 132)"><rect width="136" height="250" rx="16" class="c"/><text x="16" y="34" class="k">CONV 3</text><text x="16" y="68" class="n">10 · 5 × 5</text><text x="16" y="99" class="d">Stride 1 · ReLU</text><text x="16" y="129" class="d">No padding</text><text x="16" y="195" class="n">20 × 20 × 10</text></g><path d="M632 257h16" class="a"/>
  <g transform="translate(654 132)"><rect width="136" height="250" rx="16" class="c"/><text x="16" y="34" class="k">CONV 4</text><text x="16" y="68" class="n">10 · 5 × 5</text><text x="16" y="99" class="d">Stride 1 · ReLU</text><text x="16" y="129" class="d">No padding</text><text x="16" y="195" class="n">16 × 16 × 10</text></g><path d="M790 257h16" class="a"/>
  <g transform="translate(812 132)"><rect width="136" height="250" rx="16" class="c"/><text x="16" y="34" class="k">CONV 5</text><text x="16" y="68" class="n">5 · 3 × 3</text><text x="16" y="99" class="d">Stride 1 · ReLU</text><text x="16" y="129" class="d">No padding</text><text x="16" y="195" class="n">14 × 14 × 5</text></g><path d="M948 257h16" class="a"/>
  <g transform="translate(970 132)"><rect width="92" height="250" rx="16" class="c"/><text x="13" y="34" class="k">FLATTEN</text><text x="13" y="68" class="n">980</text><text x="13" y="96" class="d">features</text><path d="M25 145h42M25 165h42M46 137v57" stroke="#2698ba" stroke-width="3"/></g><path d="M1062 257h16" class="a"/>
  <g transform="translate(1084 132)"><rect width="78" height="250" rx="16" class="c"/><text x="11" y="34" class="k">OUTPUT</text><text x="11" y="68" class="n">10</text><text x="11" y="96" class="d">Softmax</text><g fill="#2698ba"><circle cx="25" cy="145" r="5"/><circle cx="52" cy="145" r="5"/><circle cx="25" cy="174" r="5"/><circle cx="52" cy="174" r="5"/></g></g>
  <text x="38" y="444" class="s">Larger kernels in the middle layers reduce the spatial representation before classification.</text>
</svg>
