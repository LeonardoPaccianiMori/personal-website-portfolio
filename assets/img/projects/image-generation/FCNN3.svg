<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="fcnn3-title fcnn3-desc"><title id="fcnn3-title">FCNN-3 architecture</title><desc id="fcnn3-desc">MNIST input passes through three five-by-five convolutional layers and global average pooling to a ten-class softmax output.</desc><defs><marker id="fcnn3-arrow" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#2698ba"/></marker><style>.h{fill:#f8f9fa;font:700 36px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.s{fill:#a8aaad;font:400 18px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.k{fill:#2698ba;font:700 14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.5px}.n{fill:#f8f9fa;font:700 23px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.d{fill:#a8aaad;font:400 17px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.c{fill:#212529;stroke:#3a3f44;stroke-width:2}.a{fill:none;stroke:#2698ba;stroke-width:4;marker-end:url(#fcnn3-arrow)}</style></defs><rect width="1200" height="780" rx="28" fill="#1c1c1d"/><text x="60" y="62" class="h">FCNN-3 · larger kernels</text><text x="60" y="94" class="s">Three five-by-five convolutional layers and global average pooling</text><g transform="translate(60 150)"><rect width="300" height="210" rx="18" class="c"/><text x="25" y="37" class="k">INPUT</text><text x="25" y="78" class="n">MNIST image</text><text x="25" y="110" class="d">28 × 28 × 1</text></g><path d="M360 255h50" class="a"/><g transform="translate(410 150)"><rect width="300" height="210" rx="18" class="c"/><text x="25" y="37" class="k">CONVOLUTION 1</text><text x="25" y="78" class="n">5 filters · 5 × 5</text><text x="25" y="112" class="d">Stride 1 · ReLU · no padding</text><text x="25" y="181" class="n">24 × 24 × 5</text></g><path d="M710 255h50" class="a"/><g transform="translate(760 150)"><rect width="300" height="210" rx="18" class="c"/><text x="25" y="37" class="k">CONVOLUTION 2</text><text x="25" y="78" class="n">10 filters · 5 × 5</text><text x="25" y="112" class="d">Stride 1 · ReLU · no padding</text><text x="25" y="181" class="n">20 × 20 × 10</text></g><path d="M1060 255h100v305h-100" class="a"/><g transform="translate(60 455)"><rect width="300" height="210" rx="18" class="c"/><text x="25" y="37" class="k">OUTPUT</text><text x="25" y="78" class="n">10 class scores</text><text x="25" y="112" class="d">Softmax activation</text></g><g transform="translate(410 455)"><rect width="300" height="210" rx="18" class="c"/><text x="25" y="37" class="k">GLOBAL AVERAGE POOLING</text><text x="25" y="78" class="n">Feature-map averages</text><text x="25" y="112" class="d">16 × 16 × 10 → 10</text></g><g transform="translate(760 455)"><rect width="300" height="210" rx="18" class="c"/><text x="25" y="37" class="k">CONVOLUTION 3</text><text x="25" y="78" class="n">10 filters · 5 × 5</text><text x="25" y="112" class="d">Stride 1 · ReLU · no padding</text><text x="25" y="181" class="n">16 × 16 × 10</text></g><path d="M760 560h-50" class="a"/><path d="M410 560h-50" class="a"/><text x="60" y="730" class="s">The larger kernels reduce the spatial representation faster than the FCNN-1 baseline.</text></svg>
